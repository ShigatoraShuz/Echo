[project]
name = "echo-ai-service"
version = "0.1.0"
description = "Internal FastAPI inference boundary for ECHO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
core = [
  "torch==2.12.0+cu130", "transformers==5.5.0", "accelerate==1.15.0",
  "peft==0.21.0", "bitsandbytes==0.50.2", "safetensors==0.8.0",
  "numpy>=1.26", "scipy>=1.12", "pandas>=2.1", "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.26.0,<1.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
