name: AI service CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - name: Verify JSON Contract -> Pydantic Schema Sync
        run: |
          chmod +x ../scripts/generate-schemas.sh
          ../scripts/generate-schemas.sh
          if [ -n "$(git status --porcelain app/schemas/)" ]; then
            echo "ERROR: Pydantic schemas are out of sync with packages/contracts/schemas/."
            echo "Please run './scripts/generate-schemas.sh' and commit the changes."
            git diff app/schemas/
            exit 1
          fi
      - run: uv run ruff check .
      - run: uv run pytest

