name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace echo-theme-system
      - run: npm run lint --workspace echo-theme-system
      - run: npm run test --workspace echo-theme-system
      - run: npm run build --workspace echo-theme-system
