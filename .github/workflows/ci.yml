name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspaces --if-present

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --workspaces

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @echo/contracts
      - run: npm run test:e2e:routes --workspace echo-theme-system
      - run: npm run test:qa-target --workspace @echo/backend
      - run: npm run test --workspaces --if-present -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            frontend/coverage/
            backend/coverage/

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          # Compile-only public values. Staging acceptance uses its own deployment.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-only
          NEXT_PUBLIC_API_BASE_URL: https://api.ci-build.invalid/api/v1
          NEXT_PUBLIC_DATA_ADAPTER: http
