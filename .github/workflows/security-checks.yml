name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Security source boundary scan
        run: node scripts/security-scan.mjs
      - name: Explicit database schema boundaries
        run: node scripts/security-query-boundaries.mjs
      - name: Project target negative tests
        run: node --test scripts/security-project-target.test.mjs
      - name: Isolated migrations and authorization policies
        run: npm run test:sql:isolated
      - name: Authentication configuration policy
        run: npm run check:auth-policy
      - name: Validate build and public bundle
        run: |
          npm run build
          node scripts/security-scan.mjs --bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: docs/security/SECURITY_TEST_EVIDENCE.md
  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
