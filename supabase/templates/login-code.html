<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 32px; font-family: Arial, sans-serif; color: #183c32; background: #f8faf7">
    <main style="max-width: 480px; margin: auto">
      <h1 style="font-size: 24px">Your ECHO sign-in code</h1>
      <p>Enter this one-time code on the ECHO sign-in page:</p>
      <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
      <p>This code expires. If it no longer works, request a new code from ECHO.</p>
      <p>If you did not request this email, you can ignore it. Do not share this code.</p>
    </main>
  </body>
</html>
