services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4200
      - NEXT_PUBLIC_SUPABASE_URL=
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    environment:
      - PORT=4200
      - SUPABASE_URL=
      - SUPABASE_SERVICE_KEY=
      - NODE_ENV=production
